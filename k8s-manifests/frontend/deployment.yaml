apiVersion: apps/v1
kind: Deployment
metadata:
  name: studentai-frontend
  namespace: studentai
  labels:
    app: studentai-frontend
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: studentai-frontend
  template:
    metadata:
      labels:
        app: studentai-frontend
        component: frontend
    spec:
      containers:
      - name: frontend
        image: public.ecr.aws/f8g8h5d4/studentai/frontend:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: BACKEND_AUTH_URL
          value: "http://studentai-backend-auth:3001"
        - name: BACKEND_USERDETAILS_URL
          value: "http://studentai-backend-userdetails:3002"
        - name: BACKEND_PAYMENTS_URL
          value: "http://studentai-backend-payments:3003"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: studentai-frontend
  namespace: studentai
  labels:
    app: studentai-frontend
    component: frontend
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: studentai-frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: studentai-frontend-ingress
  namespace: studentai
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - host: studentai.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: studentai-frontend
            port:
              number: 80
