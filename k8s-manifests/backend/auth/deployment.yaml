apiVersion: apps/v1
kind: Deployment
metadata:
  name: studentai-backend-auth
  namespace: studentai
  labels:
    app: studentai-backend-auth
    component: backend
    service: auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: studentai-backend-auth
  template:
    metadata:
      labels:
        app: studentai-backend-auth
        component: backend
        service: auth
    spec:
      containers:
      - name: auth
        image: public.ecr.aws/f8g8h5d4/studentai/backend-auth:latest
        ports:
        - containerPort: 3001
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: studentai-db-secret
              key: host
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: studentai-db-secret
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: studentai-db-secret
              key: password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: studentai-auth-secret
              key: jwt-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: studentai-backend-auth
  namespace: studentai
  labels:
    app: studentai-backend-auth
    component: backend
    service: auth
spec:
  type: ClusterIP
  ports:
  - port: 3001
    targetPort: 3001
    protocol: TCP
    name: http
  selector:
    app: studentai-backend-auth
---
apiVersion: v1
kind: Secret
metadata:
  name: studentai-auth-secret
  namespace: studentai
type: Opaque
data:
  jwt-secret: c3R1ZGVudGFpLWp3dC1zZWNyZXQtdG9rZW4=  # base64 encoded
---
apiVersion: v1
kind: Secret
metadata:
  name: studentai-db-secret
  namespace: studentai
type: Opaque
data:
  host: bG9jYWxob3N0  # base64 encoded 'localhost'
  username: cm9vdA==  # base64 encoded 'root'
  password: cGFzc3dvcmQ=  # base64 encoded 'password'
